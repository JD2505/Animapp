<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Animapp</title>
    <link rel="icon" type="image/jpeg" href="../img/logo.jpeg">
    <link rel="stylesheet" href="login.css">
    <!-- Carga de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Módulo de autenticación y seguridad -->
    <script src="../js/auth.js"></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <span class="logo-text">Animapp</span>
            <h2>Crea tu cuenta</h2>
            <p>Únete para cuidar de tu mascota de forma rápida y fácil.</p>
        </div>

        <form id="formRegistro" class="auth-form">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp</label>
                <input type="number" id="telefono" name="telefono" placeholder="300 000 0000" required>
            </div>

            <div class="form-group input-password-wrapper">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres, número y carácter especial" required>
                <button type="button" class="btn-toggle-password" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
            </div>

            <!-- Casilla de aceptación de políticas -->
            <div class="form-group-checkbox">
                <input type="checkbox" id="aceptoPoliticas" required>
                <label for="aceptoPoliticas">
                    Acepto la <a href="#" target="_blank">Política de privacidad y manejo de datos personales</a>.
                </label>
            </div>

            <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes una cuenta? <a href="iniciar_sesion.html">Inicia sesión</a></p>
            <a href="../index.html" class="back-home">← Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const password = document.getElementById('password').value;

            // Validar campos obligatorios
            if (!nombre || !email || !telefono || !password) {
                Swal.fire({
                    icon: "error",
                    title: "Campos incompletos",
                    text: "Por favor completa todos los campos obligatorios.",
                    footer: '<a href="#">¿Necesitas ayuda con tu registro?</a>'
                });
                return;
            }

            // Registrar usuario con validaciones estrictas
            const resultado = AnimappAuth.registrarUsuario({ nombre, email, telefono, password });

            if (!resultado.exito) {
                Swal.fire({
                    icon: "error",
                    title: "Error en el registro",
                    text: resultado.mensaje,
                    footer: '<a href="#">¿Necesitas ayuda con tu registro?</a>'
                });
                return;
            }

            Swal.fire({
                title: "¡Registro exitoso!",
                text: "Tu cuenta ha sido creada con éxito. Ahora inicia sesión.",
                icon: "success",
                draggable: true
            }).then(() => {
                window.location.href = "iniciar_sesion.html";
            });
        });

        // Inicializar ojitos de contraseña
        document.addEventListener('DOMContentLoaded', () => {
            AnimappAuth.inicializarOjitos();
        });
    </script>
    <script src="../js/sesion-global.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Animapp</title>
    <link rel="icon" type="image/jpeg" href="../img/logo.jpeg">
    <link rel="stylesheet" href="login.css">
    <!-- Carga de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <span class="logo-text">Animapp</span>
            <h2>Recuperar Contraseña</h2>
            <p>Escribe tu correo y te enviaremos las instrucciones para restablecerla.</p>
        </div>

        <form id="formOlvido" class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico registrado</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="btn-submit">Enviar instrucciones</button>
        </form>

        <div class="auth-footer">
            <p><a href="iniciar_sesion.html">← Volver a Iniciar Sesión</a></p>
            <a href="../index.html" class="back-home">Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('formOlvido').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;

            Swal.fire({
                title: "¿Enviar instrucciones?",
                text: "¿Confirmas que el correo " + email + " es el correcto?",
                icon: "question",
                showCancelButton: true,
                confirmButtonText: "Sí, enviar",
                cancelButtonText: "Cancelar"
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: "¡Enviado!",
                        text: "Revisa tu bandeja de entrada para restablecer tu contraseña.",
                        icon: "success",
                        draggable: true
                    });
                }
            });
        });
    </script>
    <script src="../js/sesion-global.js"></script>

</body>
</html>

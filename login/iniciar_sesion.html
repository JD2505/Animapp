<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Animapp</title>
    <link rel="icon" type="image/jpeg" href="../img/logo.jpeg">
    <link rel="stylesheet" href="login.css">
    <!-- Carga de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Módulo de autenticación y seguridad -->
    <script src="../js/auth.js"></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <span class="logo-text">Animapp</span>
            <h2>¡Bienvenido de nuevo!</h2>
            <p>Ingresa a tu cuenta para gestionar tus citas y servicios.</p>
        </div>

        <form id="formLogin" class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group input-password-wrapper">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <button type="button" class="btn-toggle-password" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
            </div>

            <div class="form-actions">
                <a href="olvido_contrasena.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            <p>¿No tienes una cuenta? <a href="registrarse.html">Regístrate aquí</a></p>
            <a href="../index.html" class="back-home">← Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                Swal.fire({
                    icon: "error",
                    title: "Campos incompletos",
                    text: "Por favor ingresa tu correo y contraseña.",
                    footer: '<a href="olvido_contrasena.html">¿Olvidaste tu contraseña?</a>'
                });
                return;
            }

            const resultado = AnimappAuth.iniciarSesion(email, password);

            if (!resultado.exito) {
                Swal.fire({
                    icon: "error",
                    title: "Error al iniciar sesión",
                    text: resultado.mensaje,
                    footer: '<a href="olvido_contrasena.html">¿Olvidaste tu contraseña?</a>'
                });
                return;
            }

            Swal.fire({
                title: "¡Bienvenido a Animapp!",
                text: "Has iniciado sesión correctamente.",
                icon: "success",
                draggable: true
            }).then(() => {
                window.location.href = "../index.html";
            });
        });

        // Inicializar ojitos de contraseña
        document.addEventListener('DOMContentLoaded', () => {
            AnimappAuth.inicializarOjitos();
        });
    </script>
    <script src="../js/sesion-global.js"></script>

</body>
</html>
